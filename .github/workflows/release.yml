name: Release

# Push a tag like v0.2.0 (matching package.json "version") to publish to npm.
#
# Auth, either of:
# - NPM_TOKEN repository secret: an npm granular access token with read-write
#   access to @scrawl-labs and "bypass 2FA". Needed for the very first publish.
# - npm trusted publishing (OIDC), once the package exists: npmjs.com →
#   @scrawl-labs/draftr → Settings → Trusted publisher → GitHub Actions,
#   repository scrawl-labs/draftr, workflow release.yml. Then the secret can go.
#
# Can also be started by hand (Actions → Release → Run workflow) for the
# version currently in package.json on the chosen branch.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Tag matches package.json version
        if: github.ref_type == 'tag'
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
